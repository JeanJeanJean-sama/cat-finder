<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネコさがし 😺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #fff9f0;
      color: #5a4a42;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #e06d53;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #8c7b70;
    }

    .game-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(224, 109, 83, 0.15);
      border: 3px solid #ffe3d1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
      background: #fff0e6;
      padding: 10px 20px;
      border-radius: 12px;
    }

    .status-item {
      font-size: 1.2rem;
      font-weight: bold;
      color: #e06d53;
    }

    .reset-btn {
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .reset-btn:active {
      transform: scale(0.85);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #ffd8c0;
      border-radius: 10px;
      background: #fff;
      color: #7a685d;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn.active {
      background: #e06d53;
      color: #fff;
      border-color: #e06d53;
    }

    /* 盤面レイアウトの修正箇所 */
    #board {
      display: grid;
      gap: 4px;
      margin: 15px 0;
      background-color: #ffe3d1;
      padding: 8px;
      border-radius: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .cell {
      background-color: #ffd8c0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.05s;
    }

    .cell:active {
      transform: scale(0.95);
    }

    .cell.revealed {
      background-color: #fff8f3;
      cursor: default;
    }

    .cell.cat {
      background-color: #ffb3b3;
    }

    /* 数字ごとの色分け */
    .c-1 { color: #2196f3; }
    .c-2 { color: #4caf50; }
    .c-3 { color: #f44336; }
    .c-4 { color: #9c27b0; }
    .c-5 { color: #ff9800; }

    .instructions {
      font-size: 0.8rem;
      color: #a09085;
      margin-top: 15px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>🐾 ネコさがし 🐱</h1>
  <p class="subtitle">隠れているネコちゃんたちを全員見つけ出そう！</p>

  <div class="game-card">
    <div class="status-bar">
      <div class="status-item">🐟 <span id="cat-count">08</span></div>
      <button class="reset-btn" id="reset-btn">😸</button>
      <div class="status-item">⏱️ <span id="timer">000</span></div>
    </div>

    <div class="controls">
      <button class="btn active" onclick="setDifficulty('easy')">かんたん (8x8)</button>
      <button class="btn" onclick="setDifficulty('medium')">ふつう (10x10)</button>
      <button class="btn" onclick="setDifficulty('hard')">むずかしい (12x12)</button>
    </div>

    <div class="controls">
      <button class="btn active" id="mode-open" onclick="setMode('open')">🔍 ひらく</button>
      <button class="btn" id="mode-flag" onclick="setMode('flag')">🐟 おさかな</button>
    </div>

    <div id="board"></div>

    <div class="instructions">
      💡 マスを開けて、数字をたよりにネコちゃんの位置を予想しよう！<br>
      PCは右クリック、スマホは「おさかなモード」で目印（🐟）を置けます。
    </div>
  </div>

  <script>
    const CONFIGS = {
      easy: { size: 8, cats: 8 },
      medium: { size: 10, cats: 15 },
      hard: { size: 12, cats: 25 }
    };

    let currentDiff = 'easy';
    let mode = 'open'; // 'open' or 'flag'
    let board = [];
    let revealedCount = 0;
    let gameOver = false;
    let gameStarted = false;
    let timerInterval = null;
    let time = 0;
    let flagsLeft = 0;

    const boardEl = document.getElementById('board');
    const catCountEl = document.getElementById('cat-count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');

    function initGame() {
      clearInterval(timerInterval);
      time = 0;
      timerEl.textContent = '000';
      gameStarted = false;
      gameOver = false;
      revealedCount = 0;
      resetBtn.textContent = '😸';

      const config = CONFIGS[currentDiff];
      flagsLeft = config.cats;
      catCountEl.textContent = String(flagsLeft).padStart(2, '0');

      // グリッド列数の動的設定
      boardEl.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${config.size}, 1fr)`;
      boardEl.innerHTML = '';

      board = Array(config.size).fill(null).map(() => 
        Array(config.size).fill(null).map(() => ({
          hasCat: false,
          revealed: false,
          flagged: false,
          count: 0
        }))
      );

      for (let r = 0; r < config.size; r++) {
        for (let c = 0; c < config.size; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;

          cell.addEventListener('click', () => handleCellClick(r, c));
          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          boardEl.appendChild(cell);
        }
      }
    }

    function placeCats(firstRow, firstCol) {
      const config = CONFIGS[currentDiff];
      let placed = 0;

      while (placed < config.cats) {
        const r = Math.floor(Math.random() * config.size);
        const c = Math.floor(Math.random() * config.size);

        // 初回クリック位置とその周囲には配置しない
        if (!board[r][c].hasCat && (Math.abs(r - firstRow) > 1 || Math.abs(c - firstCol) > 1)) {
          board[r][c].hasCat = true;
          placed++;
        }
      }

      // 周囲のネコ数を計算
      for (let r = 0; r < config.size; r++) {
        for (let c = 0; c < config.size; c++) {
          if (!board[r][c].hasCat) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < config.size && nc >= 0 && nc < config.size) {
                  if (board[nr][nc].hasCat) count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        time++;
        timerEl.textContent = String(Math.min(time, 999)).padStart(3, '0');
      }, 1000);
    }

    function handleCellClick(r, c) {
      if (gameOver || board[r][c].flagged) return;

      if (mode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      if (!gameStarted) {
        gameStarted = true;
        placeCats(r, c);
        startTimer();
      }

      if (board[r][c].hasCat) {
        // ゲームオーバー
        gameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = '😿';
        revealAllCats();
        alert('ネコちゃんを踏んじゃった！ゲームオーバー');
        return;
      }

      revealCell(r, c);
      checkWin();
    }

    function revealCell(r, c) {
      const config = CONFIGS[currentDiff];
      if (r < 0 || r >= config.size || c < 0 || c >= config.size) return;
      if (board[r][c].revealed || board[r][c].flagged) return;

      board[r][c].revealed = true;
      revealedCount++;

      const cellEl = boardEl.children[r * config.size + c];
      cellEl.classList.add('revealed');

      if (board[r][c].count > 0) {
        cellEl.textContent = board[r][c].count;
        cellEl.classList.add(`c-${board[r][c].count}`);
      } else {
        // 連鎖オープン
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) {
              revealCell(r + dr, c + dc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameOver || board[r][c].revealed) return;

      const config = CONFIGS[currentDiff];
      const cell = board[r][c];
      const cellEl = boardEl.children[r * config.size + c];

      if (cell.flagged) {
        cell.flagged = false;
        cellEl.textContent = '';
        flagsLeft++;
      } else {
        cell.flagged = true;
        cellEl.textContent = '🐟';
        flagsLeft--;
      }

      catCountEl.textContent = String(flagsLeft).padStart(2, '0');
    }

    function revealAllCats() {
      const config = CONFIGS[currentDiff];
      for (let r = 0; r < config.size; r++) {
        for (let c = 0; c < config.size; c++) {
          if (board[r][c].hasCat) {
            const cellEl = boardEl.children[r * config.size + c];
            cellEl.textContent = '😸';
            cellEl.classList.add('cat');
          }
        }
      }
    }

    function checkWin() {
      const config = CONFIGS[currentDiff];
      if (revealedCount === (config.size * config.size - config.cats)) {
        gameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = '😻';
        alert(`クリアおめでとう！ タイム: ${time}秒`);
      }
    }

    function setDifficulty(diff) {
      currentDiff = diff;
      document.querySelectorAll('.controls:nth-of-type(2) .btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      initGame();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('mode-open').classList.toggle('active', mode === 'open');
      document.getElementById('mode-flag').classList.toggle('active', mode === 'flag');
    }

    resetBtn.addEventListener('click', initGame);

    // 初回起動
    initGame();
  </script>
</body>
</html>
