<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネコさがし 🐱 - エリアマインスイーパー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #fff9f0;
      color: #5a4a42;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #e06d53;
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      margin-bottom: 15px;
      color: #8c7b70;
      text-align: center;
    }

    .game-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(224, 109, 83, 0.15);
      border: 3px solid #ffe3d1;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
      background: #fff0e6;
      padding: 10px 20px;
      border-radius: 12px;
    }

    .status-item {
      font-size: 1.1rem;
      font-weight: bold;
      color: #e06d53;
    }

    .reset-btn {
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .reset-btn:active {
      transform: scale(0.85);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid #ffd8c0;
      border-radius: 10px;
      background: #fff;
      color: #7a685d;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn.active {
      background: #e06d53;
      color: #fff;
      border-color: #e06d53;
    }

    #board {
      display: grid;
      gap: 4px;
      margin: 10px 0;
      background-color: #d8c2b5;
      padding: 6px;
      border-radius: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .cell {
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: filter 0.15s, transform 0.05s;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
    }

    /* 未開封マスの濃い色合い */
    .cell.unrevealed {
      filter: brightness(0.95);
    }

    .cell.unrevealed:hover {
      filter: brightness(1.05);
    }

    .cell:active {
      transform: scale(0.95);
    }

    /* 開封済みマス */
    .cell.revealed {
      filter: brightness(1.15) saturate(0.6);
      cursor: default;
      box-shadow: none;
    }

    .cell.cat {
      background-color: #ff9999 !important;
      filter: none;
    }

    /* 数字ごとの色分け */
    .c-1 { color: #1e88e5; }
    .c-2 { color: #43a047; }
    .c-3 { color: #e53935; }
    .c-4 { color: #8e24aa; }

    .rules-card {
      margin-top: 15px;
      padding: 10px 15px;
      background: #fff8f3;
      border-radius: 10px;
      border: 1px solid #ffd8c0;
      font-size: 0.78rem;
      color: #7a685d;
      line-height: 1.5;
      width: 100%;
    }

    .rules-card ul {
      padding-left: 18px;
    }
  </style>
</head>
<body>

  <h1>🐾 ネコさがし 🐱</h1>
  <p class="subtitle">色分けエリアをヒントにネコちゃんを避けて開けよう！</p>

  <div class="game-card">
    <div class="status-bar">
      <div class="status-item">🐟 <span id="cats-left">08</span></div>
      <button class="reset-btn" id="reset-btn">😸</button>
      <div class="status-item">⏱️ <span id="timer">000</span></div>
    </div>

    <div class="controls">
      <button class="btn active" onclick="setDifficulty('easy')">かんたん (8x8)</button>
      <button class="btn" onclick="setDifficulty('medium')">ふつう (10x10)</button>
    </div>

    <div class="controls">
      <button class="btn active" id="mode-open" onclick="setMode('open')">🔍 ひらく</button>
      <button class="btn" id="mode-flag" onclick="setMode('flag')">🐟 おさかな</button>
    </div>

    <div id="board"></div>

    <div class="rules-card">
      <strong>【ルール】</strong>
      <ul>
        <li>数字は<strong>周囲8マスにいるネコの数</strong>を示します。</li>
        <li><strong>同じ色のエリアにはネコが1匹ずつ</strong>隠れています！</li>
        <li>ネコがいると思った場所には「🐟」を置いて保護しよう。</li>
      </ul>
    </div>
  </div>

  <script>
    const AREA_COLORS = [
      '#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF',
      '#E8AEFF', '#FFC6FF', '#C4FAF8', '#F3FFE3', '#FFE5EC'
    ];

    const CONFIGS = {
      easy: { size: 8, cats: 8 },
      medium: { size: 10, cats: 10 }
    };

    let currentDiff = 'easy';
    let mode = 'open';
    let board = [];
    let regions = [];
    let revealedCount = 0;
    let flagsLeft = 0;
    let gameOver = false;
    let gameStarted = false;
    let timerInterval = null;
    let time = 0;

    const boardEl = document.getElementById('board');
    const catsLeftEl = document.getElementById('cats-left');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');

    function initGame() {
      clearInterval(timerInterval);
      time = 0;
      timerEl.textContent = '000';
      gameStarted = false;
      gameOver = false;
      revealedCount = 0;
      resetBtn.textContent = '😸';

      const config = CONFIGS[currentDiff];
      flagsLeft = config.cats;
      catsLeftEl.textContent = String(flagsLeft).padStart(2, '0');

      board = Array(config.size).fill(null).map(() => 
        Array(config.size).fill(null).map(() => ({
          hasCat: false,
          revealed: false,
          flagged: false,
          count: 0
        }))
      );

      boardEl.style.gridTemplateColumns = `repeat(${config.size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${config.size}, 1fr)`;
      boardEl.innerHTML = '';

      // 1. 各エリアに1匹ずつネコを配置
      generateRegionsAndCats(config.size, config.cats);

      // 2. マウント
      for (let r = 0; r < config.size; r++) {
        for (let c = 0; c < config.size; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell', 'unrevealed');
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          const regionId = regions[r][c];
          cell.style.backgroundColor = AREA_COLORS[regionId % AREA_COLORS.length];

          cell.addEventListener('click', () => handleCellClick(r, c));
          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          boardEl.appendChild(cell);
        }
      }
    }

    function generateRegionsAndCats(size, catCount) {
      regions = Array(size).fill(null).map(() => Array(size).fill(-1));
      
      // ランダムにネコの位置を決定（エリアの核になる）
      let placedCats = 0;
      let seeds = [];

      while (placedCats < catCount) {
        const r = Math.floor(Math.random() * size);
        const c = Math.floor(Math.random() * size);
        if (!board[r][c].hasCat) {
          board[r][c].hasCat = true;
          regions[r][c] = placedCats;
          seeds.push({r, c, id: placedCats});
          placedCats++;
        }
      }

      // エリア（色分け）の領域拡張
      let unassigned = size * size - catCount;
      let frontier = [];

      seeds.forEach(s => {
        const neighbors = getNeighbors(s.r, s.c, size);
        neighbors.forEach(n => frontier.push({...n, id: s.id}));
      });

      while (unassigned > 0 && frontier.length > 0) {
        const idx = Math.floor(Math.random() * frontier.length);
        const current = frontier.splice(idx, 1)[0];

        if (regions[current.r][current.c] === -1) {
          regions[current.r][current.c] = current.id;
          unassigned--;

          const neighbors = getNeighbors(current.r, current.c, size);
          neighbors.forEach(n => {
            if (regions[n.r][n.c] === -1) {
              frontier.push({...n, id: current.id});
            }
          });
        }
      }

      // 周囲のネコ数を算出
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (!board[r][c].hasCat) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                  if (board[nr][nc].hasCat) count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function getNeighbors(r, c, size) {
      const list = [];
      if (r > 0) list.push({r: r - 1, c});
      if (r < size - 1) list.push({r: r + 1, c});
      if (c > 0) list.push({r, c: c - 1});
      if (c < size - 1) list.push({r, c: c + 1});
      return list;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        time++;
        timerEl.textContent = String(Math.min(time, 999)).padStart(3, '0');
      }, 1000);
    }

    function handleCellClick(r, c) {
      if (gameOver || board[r][c].flagged) return;

      if (mode === 'flag') {
        toggleFlag(r, c);
        return;
      }

      if (!gameStarted) {
        gameStarted = true;
        startTimer();
      }

      if (board[r][c].hasCat) {
        gameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = '😿';
        revealAllCats();
        alert('ネコちゃんを踏んじゃった！ゲームオーバー');
        return;
      }

      revealCell(r, c);
      checkWin();
    }

    function revealCell(r, c) {
      const config = CONFIGS[currentDiff];
      if (r < 0 || r >= config.size || c < 0 || c >= config.size) return;
      if (board[r][c].revealed || board[r][c].flagged) return;

      board[r][c].revealed = true;
      revealedCount++;

      const cellEl = boardEl.children[r * config.size + c];
      cellEl.classList.remove('unrevealed');
      cellEl.classList.add('revealed');

      if (board[r][c].count > 0) {
        cellEl.textContent = board[r][c].count;
        cellEl.classList.add(`c-${board[r][c].count}`);
      } else {
        // 周囲にネコがいない場合は連鎖オープン
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr !== 0 || dc !== 0) {
              revealCell(r + dr, c + dc);
            }
          }
        }
      }
    }

    function toggleFlag(r, c) {
      if (gameOver || board[r][c].revealed) return;

      const config = CONFIGS[currentDiff];
      const cell = board[r][c];
      const cellEl = boardEl.children[r * config.size + c];

      if (cell.flagged) {
        cell.flagged = false;
        cellEl.textContent = '';
        flagsLeft++;
      } else {
        cell.flagged = true;
        cellEl.textContent = '🐟';
        flagsLeft--;
      }

      catsLeftEl.textContent = String(flagsLeft).padStart(2, '0');
    }

    function revealAllCats() {
      const config = CONFIGS[currentDiff];
      for (let r = 0; r < config.size; r++) {
        for (let c = 0; c < config.size; c++) {
          if (board[r][c].hasCat) {
            const cellEl = boardEl.children[r * config.size + c];
            cellEl.textContent = '😸';
            cellEl.classList.add('cat');
          }
        }
      }
    }

    function checkWin() {
      const config = CONFIGS[currentDiff];
      if (revealedCount === (config.size * config.size - config.cats)) {
        gameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = '😻';
        setTimeout(() => {
          alert(`🎉 クリアおめでとう！ タイム: ${time}秒`);
        }, 100);
      }
    }

    function setDifficulty(diff) {
      currentDiff = diff;
      document.querySelectorAll('.controls:nth-of-type(1) .btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      initGame();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('mode-open').classList.toggle('active', mode === 'open');
      document.getElementById('mode-flag').classList.toggle('active', mode === 'flag');
    }

    resetBtn.addEventListener('click', initGame);

    // 初回起動
    initGame();
  </script>
</body>
</html>
